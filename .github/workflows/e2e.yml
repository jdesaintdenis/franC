name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: franc
          POSTGRES_PASSWORD: franc
          POSTGRES_DB: franc_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U franc -d franc_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values: the database is the throwaway service above.
      DATABASE_URL: postgres://franc:franc@localhost:5432/franc_dev
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: owner@example.com,e2e@example.com,e2e-new@example.com
      E2E_USER_EMAIL: e2e@example.com
      E2E_USER_PASSWORD: e2e-password-123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - run: pnpm db:migrate

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Builds and starts the production server itself (CI disables server reuse).
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
